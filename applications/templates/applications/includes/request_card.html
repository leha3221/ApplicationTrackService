<article class="card request-card mb-3">
    <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between gap-2">
            <h2 class="h5 card-title">
                <a class="card-link" href="{% url 'applications:detail' item.id %}">
                    Заявление № {{ item.id }}
                </a>
            </h2>
            {% include "applications/includes/request_status.html" %}
        </div>
        <p class="mb-1">
            Сотрудник:
            <a href="{% url 'employees:detail' item.employee.id %}">
                {{ item.employee.fio|default:"Не указан" }}
            </a>
        </p>
        <p class="mb-1">Тип: {{ item.type|default:"Не указан" }}</p>
        <p class="text-muted mb-0">Дата: {{ item.date|default:"Не указана" }}</p>
    </div>
</article>
