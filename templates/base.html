{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Кадровые заявления{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% include "includes/navigation.html" %}

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="container site-footer">
        <span>© <span id="current-year"></span> Сервис учёта кадровых заявлений</span>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script src="{% static 'homepage/js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
